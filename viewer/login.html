<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — LameStreet</title>
  <script>
    // Same pre-paint theme resolution as the dashboard.
    (() => {
      const pinned = new URLSearchParams(location.search).get('theme');
      if (pinned === 'light' || pinned === 'dark') {
        document.documentElement.setAttribute('data-bs-theme', pinned);
        return;
      }
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      const apply = () => document.documentElement.setAttribute('data-bs-theme', mq.matches ? 'dark' : 'light');
      apply();
      mq.addEventListener('change', apply);
    })();
  </script>
  <link rel="stylesheet" href="/assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/vendor/bootstrap-icons.css">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M8 21l5-6 4 3 7-9' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="login-body">
  <main class="login card">
    <span class="brand-mark login-mark"><i class="bi bi-graph-up-arrow"></i></span>
    <h1>LameStreet</h1>
    <p class="login-sub">Sign in to see the family's holdings</p>
    <form id="form-login" autocomplete="on">
      <input class="form-control" name="username" placeholder="username"
        autocomplete="username" autofocus required>
      <input class="form-control" name="password" type="password" placeholder="password"
        autocomplete="current-password" required>
      <button class="btn btn-primary w-100" type="submit" id="btn-login">
        <i class="bi bi-unlock"></i>Sign in</button>
    </form>
    <p class="msg err" id="msg" role="alert"></p>
  </main>

  <script>
    const form = document.getElementById('form-login');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn-login');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      btn.disabled = true;
      try {
        const f = new FormData(form);
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: f.get('username'), password: f.get('password') }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.detail || `request failed (${res.status})`);
        location.replace('/');
      } catch (err) {
        msg.textContent = err.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
